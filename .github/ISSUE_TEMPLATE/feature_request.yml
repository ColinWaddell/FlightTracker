---
name: Feature request
description: Suggest a new feature or improvement for FlightTracker
title: "[FEATURE] "
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please read the
        [contributing guide](https://github.com/ColinWaddell/FlightTracker/blob/main/CONTRIBUTING.md)
        to understand how feature requests are triaged and what to expect.

  - type: markdown
    attributes:
      value: |
        **A note on screen sizes:** I currently have no plans to support
        different screen sizes. I like the challenge of working within this
        screen size, and the fact that it's cheap and easy for people to buy
        and assemble themselves. With the amount of work that's gone into
        making everything work pixel-perfect on this display, I don't really
        fancy doing it all again for another size.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is your feature request related to a problem? Describe what's currently difficult or impossible to do.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the solution you'd like. Screenshots, mockups, or rough sketches are all welcome.
    validations:
      required: true

