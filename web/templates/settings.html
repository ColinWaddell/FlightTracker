<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" />
  <title>FlightTracker - Settings</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
{% include "navbar.html" %}

<!-- Vue mounts here -->
<div id="settings-app"></div>

<div class="container-fluid pb-4" style="max-width:1100px">
  {% include "footer.html" %}
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.js"></script>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>

<script>
  // Inject server-side data for the Vue app.
  // FT_CONFIG: the raw config dict (field names match backend keys).
  // FT_PAGE_DATA: everything else the UI needs.
  window.FT_CONFIG = {{ cfg | tojson }};
  window.FT_PAGE_DATA = {
    airports: {{ airports_json | safe }},
    templateErrors: {{ template_errors | tojson }},
    error: {{ error | tojson }},
    importFailed: {{ import_failed | tojson }},
    csrfToken: {{ csrf_token | tojson }},
    inSchedule: {{ in_schedule | tojson }},
    scheduleWindow: {{ schedule_window_json | tojson }},
    scheduleAdvancedActive: {{ schedule_advanced_active | tojson }},
    currentVersion: {{ current_version | tojson }},
    providersMeta: {{ providers_meta | tojson }},
    flightProvidersOrder: {{ flight_providers_order | tojson }},
    routeProvidersOrder: {{ route_providers_order | tojson }},
    maskToken: {{ mask_token | tojson }},
    staticUrls: {
      weatherExplained: "{{ url_for('static', filename='images/weather_explained.png') }}",
      scaleExplained: "{{ url_for('static', filename='images/scale_explained.png') }}",
    },
    symbolImages: {
      "{symbol:altitude}": "{{ url_for('static', filename='images/symbols_altitude.png') }}",
      "{symbol:speed}": "{{ url_for('static', filename='images/symbols_speed.png') }}",
      "{symbol:heading}": "{{ url_for('static', filename='images/symbols_heading.png') }}",
      "{symbol:degree}": "{{ url_for('static', filename='images/symbols_degrees.png') }}",
      "{symbol:origin_arrow}": "{{ url_for('static', filename='images/symbols_origin.png') }}",
      "{symbol:dest_arrow}": "{{ url_for('static', filename='images/symbols_destination.png') }}"
    },
    urls: {
      logs: "{{ url_for('logs') }}",
      update: "{{ url_for('update') }}",
      cacheClear: "/cache-clear",
      backupExport: "/backup/export",
      backupRestore: "/backup/restore",
      debugConfig: "/debug-config"
    }
  };
</script>

<!-- Vue app (ES module) -->
<script type="module" src="{{ url_for('static', filename='vue/main.js') }}"></script>
</body>
</html>
